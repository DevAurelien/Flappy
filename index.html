<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./src/assets/css/style.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Chewy&display=swap"
      rel="stylesheet"
    />
    <title>Flappy</title>
  </head>
  <body>
    <!-- <h1>Flappy Dimensions</h1> -->
    <div id="app">
      
      <img class="titre" src="/titre.png" alt="Logo Flappy Dimensions" />
      <!-- <div id="overlay"></div> -->
      <div class="container">
        <div class="game-container">
          <div id="overlay"></div>
          <canvas id="canvas"></canvas>
          <button id="btn-jouer" class="btn-jouer">Jouer</button>
        </div>
        <div class="bottom-container">
          <!-- Scores  -->

          <p class="level" id="affichage-level"></p>
          <div class="div-Btn">
            <div id="div-scores">
              <div id="score">
                <img src="./src/assets/scores/etoile.png" alt="Etoile" />
                <span>SCORE</span><p id="affichage-score">125</p><span> points</span>
              </div>
              <div id="distance">
                <img src="./src/assets/scores/drapeau.png" alt="Drapeau" />
                <span>DISTANCE</span><p id="affichage-distance">125</p><span> m</span>
              </div>
              <div id="temps">
                <img src="./src/assets/scores/chrono.png" alt="Chrono" />
                <span>TEMPS</span><p id="affichage-chrono">00:00:00</p>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/js/main.js"></script>
    <!-- <script type="module" src="/src/js/mainAurelien.js"></script> -->
  </body>
</html>
